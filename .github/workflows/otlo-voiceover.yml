name: Otlo voice-over
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Voice script JSON under otlo/pilot"
        default: "tulsi_vo.json"
  push:
    paths: ["otlo/**/*_vo.json", ".github/workflows/otlo-voiceover.yml"]
permissions:
  contents: write
jobs:
  vo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Record voice-over
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: otlo/pilot
        run: |
          pip install --quiet requests
          mkdir -p vo
          if [ -z "$GEMINI_API_KEY" ]; then echo "NO_KEY (GitHub secret GEMINI_API_KEY missing)" > vo/log.txt; else
            python3 make_vo.py "${{ github.event.inputs.script || 'tulsi_vo.json' }}" vo || true; fi
          cat vo/log.txt
      - name: Commit audio
        run: |
          git config user.name "Otlo bot"; git config user.email "saumyadshah@users.noreply.github.com"
          git add otlo/pilot/vo
          git diff --cached --quiet || git commit -m "Otlo: voice-over via GitHub Actions"
          git pull --rebase && git push
