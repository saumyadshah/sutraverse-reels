identity:
  name: "SutraVerse"
  category: cinematic
  mood: reverent, intelligent, warm, cinematic
  pace: deliberate
  best_for: "Ancient Indian scripture and philosophy explained for modern life — Hindi-narrated, English on-screen (SutraVerse channel)"

taste_profile:
  design_read: "Bright, festive, premium mythic explainer: royal indigo fields lit by saffron and marigold sunrise light, ivory text, joyful Indian ornament."
  visual_variance: 6
  motion_intensity: 5
  information_density: 4
  palette_discipline: "Royal indigo carries most fields; saffron/marigold are light, chips and emphasis; ivory caption cards; ember red only for conflict."
  layout_variation: "Alternate full-bleed tableau (scripture world), intimate modern-life vignettes, and typographic insight frames."
  reference_strategy: "Lock a character/visual bible (silhouette shapes, costume, palette, lighting) before authoring scenes; reuse it across a series."
  anti_patterns:
    - "static slideshow of stills with music"
    - "cartoonish or comedic depictions of deities and sages"
    - "neon, glossy, or meme aesthetics"
    - "paragraphs of on-screen text"
    - "Devanagari or Hindi subtitles on screen"
    - "generic stock-motivation imagery (mountains, sunrise, running man)"
  quality_gates:
    - "Every scene has visible motion (camera drift, parallax, particles, character action, or kinetic type)."
    - "Scripture frames feel timeless; modern frames feel specifically Indian and contemporary."
    - "Saffron and marigold read as light and celebration, never as muddy orange fill."

visual_language:
  color_palette:
    primary: ["#2340B8", "#142477"]
    accent: ["#FF7A1A", "#FFB22E"]
    background: "#0E1A5A"
    text: "#FFF6E6"
    muted: "#A9B6F0"
  composition: "centred sacred geometry for scripture beats; rule-of-thirds vignettes for modern life; generous negative space"
  texture: "subtle parchment grain, soft volumetric light, gold leaf line-work, film vignette"

typography:
  headings:
    font: "Cormorant Garamond"
    weight: 600
    tracking: "0em"
  body:
    font: "Inter"
    weight: 500
    line_height: 1.3
  code:
    font: "Inter"
    weight: 500
  stat_card:
    font: "Cinzel"
    weight: 700
    size_multiplier: 2.6
  scale_system: "perfect_fourth"
  weight_matrix:
    title: 700
    heading: 600
    body: 500
    caption: 600

motion:
  transitions: [dissolve, fade, light-wipe]
  animation_style: "slow cinematic drift, draw-on gold line-work, floating embers, word-by-word reveals; eased, never bouncy except tiny brand accents"
  pacing_rules:
    min_scene_hold_seconds: 2.5
    max_scene_hold_seconds: 10
    text_card_hold_seconds: 2.8
    stat_card_hold_seconds: 2.5
    transition_duration_seconds: 0.45
  entrance: "rise 20px with opacity ramp, or gold stroke draw-on"
  exit: "dissolve 0.45s"

audio:
  voice_style: "warm, mature Hindi storyteller; conversational; pauses before insights"
  music_mood: "tanpura drone, soft strings or bansuri, low cinematic pads; never busy"
  music_volume: 0.12
  sfx_style: "soft whooshes, bell or temple-chime accents at reveals, low booms only on conflict"
  ducking_threshold_db: -4

asset_generation:
  image_prompt_prefix: "vibrant cinematic painterly illustration, ancient India, royal indigo and saffron-marigold palette, bright sunrise rim light, volumetric atmosphere, subtle parchment texture, reverent tone, "
  image_negative_prompt: "text, letters, watermark, logo, extra limbs, deformed hands, distorted face, cartoonish deity, comedic, neon, glossy plastic, modern objects in ancient scenes, gore"
  diagram_style: "gold line-work on midnight, thin strokes, hand-inked feel"
  consistency_anchors:
    - "Bright royal-indigo field with saffron and marigold light"
    - "Amber light sources (diyas, dusk sun, screen glow)"
    - "Characters keep fixed silhouette, costume and colour keys from the visual bible"
    - "English-only typography: Cormorant Garamond display, Inter UI, Cinzel logotype"

overlays:
  stat_card:
    bg: "#142477"
    border: "#FFB22E"
    radius: 14
    shadow: "0 0 24px rgba(240,160,64,0.25)"
  key_term:
    bg: "#1B2550"
    text: "#E8C979"
    radius: 8
  code_block:
    bg: "#060A1C"
    text: "#EFE3C8"
    highlight: "#C9A24A"

quality_rules:
  - "Minimum contrast ratio 4.5:1 for subtitles and labels"
  - "All on-screen text is English; Sanskrit only as a verified verse with English alongside"
  - "Subtitles stay inside the platform safe area and never collide with scene text"
  - "No more than one short on-screen phrase at a time besides subtitles"
  - "Brand watermark stays subtle (<= 60% opacity) and away from subtitles"

chart_palette:
  - "#FF7A1A"
  - "#FFB22E"
  - "#A9B6F0"
  - "#FFF6E6"

color_rules:
  harmony_type: "complementary"
  contrast_validation: true
  colorblind_safe: true
