name: Otlo voice-over
# Records Gujarati voice-overs with Gemini TTS (free tier), using the repo secret GEMINI_API_KEY.
# Trigger: push a change to otlo/toolkit/vo/queue.txt. Each line: "<script.json path> <output dir>" (paths from repo root).
# Writes <output dir>/s1.wav..., log.txt and transcript.txt (Gemini transcription, as a leak check), then commits them.
on:
  workflow_dispatch:
  push:
    paths: ["otlo/toolkit/vo/queue.txt"]
permissions:
  contents: write
concurrency: { group: otlo-vo, cancel-in-progress: false }
jobs:
  vo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Record voice-over
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install --quiet requests
          while read -r js od; do
            [ -z "$js" ] && continue
            mkdir -p "$od"
            if [ -z "$GEMINI_API_KEY" ]; then echo "NO_KEY (GitHub secret GEMINI_API_KEY missing)" > "$od/log.txt"; continue; fi
            python3 otlo/toolkit/vo/make_vo.py "$js" "$od" || echo "make_vo failed" >> "$od/log.txt"
            timeout 600 python3 otlo/toolkit/vo/transcribe.py "$od" || echo "transcribe failed or timed out" > "$od/transcript.txt"
          done < otlo/toolkit/vo/queue.txt
      - name: Commit audio
        run: |
          git config user.name "Otlo bot"; git config user.email "saumyadshah@users.noreply.github.com"
          git add -A otlo/work
          git diff --cached --quiet || git commit -m "Otlo: voice-over via GitHub Actions"
          git pull --rebase && git push
