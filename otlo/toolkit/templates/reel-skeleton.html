<!doctype html><html lang="gu"><head><meta charset="utf-8">
<!-- Otlo Reel skeleton. Lives at otlo/work/<date-slug>/reel.html. Copy, then replace the scenes.
     Rules: one scene per voice line (same order as script.json); scene data-s/data-e are the ORIGINAL
     animation timings (they get stretched to the voice automatically); element data-in is inside its scene.
     Keep text out of the bottom 260px (subtitles). Illustrations: draw inline SVG in brand colours that show the
     actual subject (khaman looks like khaman). No movie stills, posters, logos of others, or real people's faces. -->
<link rel="stylesheet" href="../../toolkit/runtime/otlo.css">
</head><body>
<div id="stage">
<svg class="band" style="top:0" viewBox="0 0 1080 36"><defs><pattern id="pt" width="36" height="36" patternUnits="userSpaceOnUse"><rect width="36" height="36" fill="#1B2A4A"/><path d="M18 4 L32 18 L18 32 L4 18 Z" fill="#A8322A"/><path d="M18 11 L25 18 L18 25 L11 18 Z" fill="#E3A21A"/></pattern></defs><rect width="1080" height="36" fill="url(#pt)"/></svg>
<svg class="band" style="bottom:0" viewBox="0 0 1080 36"><rect width="1080" height="36" fill="url(#pt)"/></svg>

<!-- S1: hook -->
<div class="scene" data-s="0" data-e="5">
  <span class="chip a" data-in="0.1">{{CHIP_GU}} · {{CHIP_EN}}</span>
  <div class="gu a" data-in="0.35" data-pop="1" style="font-size:170px;margin-top:10px">{{HOOK_GU}}</div>
  <div class="en a" data-in="0.9" style="font-size:104px">{{HOOK_EN}}</div>
  <div class="art a" data-in="1.0" data-rise="300"><svg width="620" height="620" viewBox="-300 -300 600 600"><!-- ART --></svg></div>
</div>
<!-- S2..S5: body scenes, e.g. -->
<div class="scene" data-s="5" data-e="10">
  <span class="kick a" data-in="5.15" style="font-size:46px">{{KICK_GU}} · {{KICK_EN}}</span>
  <div class="gu a" data-in="5.3" style="font-size:140px">{{HEAD_GU}}</div>
  <div class="en a" data-in="5.7" style="font-size:110px">{{HEAD_EN}}</div>
  <div class="body a" data-in="6.3" style="font-size:46px">{{BODY_EN}}</div>
</div>
<!-- question scene (engagement): -->
<div class="scene" data-s="10" data-e="15">
  <span class="kick a" data-in="10.15" style="font-size:46px">તમે શું કહો છો? · Your call</span>
  <div class="box a" data-in="10.6" style="background:var(--haldi)"><div class="gu" style="font-size:64px">{{Q_GU}}</div><div class="en" style="font-size:52px;margin-top:10px">{{Q_EN}}</div></div>
</div>
<!-- END CARD (keep) -->
<div class="scene" data-s="20.0" data-e="23.5" style="align-items:center;justify-content:center;padding-top:0;gap:34px">
  <div class="a" data-in="20.1" data-pop="1" data-origin="center"><svg width="520" height="520" viewBox="0 0 400 400"><circle cx="200" cy="200" r="200" fill="#1B2A4A"/><line x1="80" y1="110" x2="320" y2="110" stroke="#E3A21A" stroke-width="5"/><polygon points="85,110 125,110 105,150" fill="#C2185B"/><polygon points="125,110 165,110 145,150" fill="#E3A21A"/><polygon points="165,110 205,110 185,150" fill="#C2185B"/><polygon points="195,110 235,110 215,150" fill="#E3A21A"/><polygon points="235,110 275,110 255,150" fill="#C2185B"/><polygon points="275,110 315,110 295,150" fill="#E3A21A"/><text x="200" y="275" text-anchor="middle" font-family="Anek Gujarati" font-weight="700" font-size="116" fill="#F3E9D6">ઓટલો</text></svg></div>
  <div class="en a" data-in="20.5" style="font-size:120px;letter-spacing:.04em">OTLO</div>
  <div class="gu a" data-in="20.8" style="font-size:66px">ગુજરાતની વાતો, ઓટલા પર</div>
  <div class="kick a" data-in="21.1" style="font-size:44px">@otlo.gujarat · Next: {{NEXT}}</div>
</div>
</div>
<script src="../../toolkit/runtime/otlo.js"></script>
<script>
// optional per-reel animation: window.extra=function(t){ /* t = original timeline seconds */ };
</script>
</body></html>
