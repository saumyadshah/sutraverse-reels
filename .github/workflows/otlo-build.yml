name: Otlo build
# Builds Otlo Reels. Trigger: push a change to otlo/toolkit/queue.txt; each non-empty line is a work dir
# (e.g. otlo/work/2026-11-22-family-invite) holding script.json + reel.html (a Reel) or carousel.html (a carousel).
# For each: records the Gujarati voice with Gemini TTS (secret GEMINI_API_KEY) unless vo/ already has every clip,
# renders reel.mp4 + cover.jpg + contact.jpg + qa.json, and commits them.
on:
  workflow_dispatch:
  push:
    paths: ["otlo/toolkit/queue.txt"]
permissions:
  contents: write
concurrency: { group: otlo-build, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          pip install --quiet requests numpy pillow playwright
          python -m playwright install --with-deps chromium > /dev/null
          (cd otlo/toolkit && npm install --silent)
      - name: Voice + render
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          while read -r wd mode <&3; do
            [ -z "$wd" ] && continue
            case "$wd" in \#*) continue;; esac
            : > "$wd/build.log"
            if [ -f "$wd/carousel.html" ] && [ ! -f "$wd/script.json" ]; then
              if python3 otlo/toolkit/bin/build.py carousel "$wd" >> "$wd/build.log" 2>&1; then echo "BUILD OK" >> "$wd/build.log"; else echo "BUILD FAILED" >> "$wd/build.log"; fi
              tail -20 "$wd/build.log"; continue
            fi
            if grep -q '"images"' "$wd/script.json" 2>/dev/null; then timeout 420 python3 otlo/toolkit/img/get_images.py "$wd" >> "$wd/build.log" 2>&1 || echo "IMAGES FAILED OR TIMED OUT" >> "$wd/build.log"; fi
            mkdir -p "$wd/vo"
            n=$(python3 -c "import json;print(len(json.load(open('$wd/script.json'))['lines']))")
            have=$(ls "$wd"/vo/s*.wav 2>/dev/null | wc -l)
            if [ "$have" -lt "$n" ]; then
              if [ -z "$GEMINI_API_KEY" ]; then echo "NO_KEY (GitHub secret GEMINI_API_KEY missing)" >> "$wd/build.log"; continue; fi
              timeout 600 python3 otlo/toolkit/vo/make_vo.py "$wd/script.json" "$wd/vo" >> "$wd/build.log" 2>&1 || echo "VOICE FAILED OR TIMED OUT" >> "$wd/build.log"
            fi
            # "<dir> assets" in queue.txt: fetch images + voice only (render happens in the session)
            if [ "$mode" = "assets" ]; then echo "ASSETS OK" >> "$wd/build.log"; tail -30 "$wd/build.log"; continue; fi
            if timeout 1200 python3 -u otlo/toolkit/bin/build.py render "$wd" >> "$wd/build.log" 2>&1; then echo "BUILD OK" >> "$wd/build.log"; else echo "BUILD FAILED" >> "$wd/build.log"; fi
            tail -40 "$wd/build.log"
          done 3< otlo/toolkit/queue.txt
      - name: Commit outputs
        run: |
          git config user.name "Otlo bot"; git config user.email "saumyadshah@users.noreply.github.com"
          git add -A otlo/work
          git diff --cached --quiet || git commit -m "Otlo: build outputs via GitHub Actions"
          git checkout -- otlo/toolkit 2>/dev/null || true; git pull --rebase --autostash && git push
